<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Vittor Beckham — ADS e Ciência de Dados" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="0.55" stop-color="#0F1E4A"/>
      <stop offset="1" stop-color="#0B3A52"/>
    </linearGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1D4ED8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#1D4ED8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" x2="1">
      <stop offset="0" stop-color="#1D4ED8"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#22D3EE" stroke-opacity="0.10" stroke-width="1"/>
      <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="48 48" dur="8s" repeatCount="indefinite"/>
    </pattern>
  </defs>
  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>
  <circle cx="180" cy="90" r="260" fill="url(#glowB)">
    <animate attributeName="cx" values="180;260;180" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1040" cy="250" r="260" fill="url(#glowC)">
    <animate attributeName="cx" values="1040;960;1040" dur="11s" repeatCount="indefinite"/>
  </circle>
  <g fill="#22D3EE">
    <circle cx="120" cy="260" r="2.5"><animate attributeName="cy" values="270;40;270" dur="9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.9;0" dur="9s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="280" r="2"><animate attributeName="cy" values="290;60;290" dur="7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="470" cy="270" r="3"><animate attributeName="cy" values="280;30;280" dur="11s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.9;0" dur="11s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="285" r="2"><animate attributeName="cy" values="295;50;295" dur="8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="8s" repeatCount="indefinite"/></circle>
    <circle cx="880" cy="265" r="2.5"><animate attributeName="cy" values="275;40;275" dur="10s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.9;0" dur="10s" repeatCount="indefinite"/></circle>
    <circle cx="1080" cy="280" r="2"><animate attributeName="cy" values="290;70;290" dur="6.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="6.5s" repeatCount="indefinite"/></circle>
  </g>
  <text x="600" y="150" text-anchor="middle" fill="#FFFFFF" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="70" font-weight="700" letter-spacing="6">VITTOR BECKHAM</text>
  <rect x="440" y="172" width="320" height="4" rx="2" fill="url(#line)"/>
  <text x="600" y="220" text-anchor="middle" fill="#22D3EE" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" letter-spacing="4">ADS  |  CIÊNCIA DE DADOS  |  FUTURO ENGENHEIRO DE IA</text>
</svg>
