<svg xmlns="http://www.w3.org/2000/svg" width="440.000" height="192" viewBox="0 0 440.000 192" role="img" aria-labelledby="t"><title id="t">trabalho-linux-processos-: SO · Processos Linux. Processos do Minecraft Java no Ubuntu: hierarquia PID/PPID, CPU, memória, prioridades e sinais de controle.</title><style>@font-face{font-family:se;src:url(data:font/woff;base64,) format("woff")}@font-face{font-family:sa;src:url(data:font/woff;base64,) format("woff")}@font-face{font-family:mo;src:url(data:font/woff;base64,) format("woff")}@font-face{font-family:mm;src:url(data:font/woff;base64,) format("woff")}text{font-kerning:none}
.a{animation-fill-mode:both;animation-duration:.8s;animation-timing-function:cubic-bezier(.2,.7,.2,1)}
