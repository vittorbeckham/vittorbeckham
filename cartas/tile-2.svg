<svg xmlns="http://www.w3.org/2000/svg" width="293.333" height="222" viewBox="0 0 293.333 222" role="img" aria-labelledby="t"><title id="t">PROJETOS: 4 projetos. Dados, redes, Linux e automação em Python — cada um documentado com relatório e evidências.</title><style>@font-face{font-family:si;src:url(data:font/woff;base64,) format("woff")}@font-face{font-family:sm;src:url(data:font/woff;base64,) format("woff")}@font-face{font-family:mm;src:url(data:font/woff;base64,) format("woff")}text{font-kerning:none}
.a{animation-fill-mode:both;animation-duration:.8s;animation-timing-function:cubic-bezier(.2,.7,.2,1)}
.rise{animation-name:rise}.fade{animation-name:fade;animation-duration:.9s;animation-timing-function:ease-out}
.slide{animation-name:slide}
.pop{animation-name:pop;animation-duration:.45s;animation-timing-function:ease-out;transform-box:fill-box;transform-origin:center}
.grow{animation-name:grow;transform-box:fill-box;transform-origin:50% 100%}
.growx{animation-name:growx;transform-box:fill-box;transform-origin:0 50%;animation-duration:1.1s}
.tilein{animation-name:tilein;animation-duration:1.15s;animation-timing-function:ease-out;transform-box:fill-box;transform-origin:50% 100%}
.live{animation:live 1.6s ease-in-out infinite}
.ring{animation:ring 2.6s ease-out infinite;transform-box:fill-box;transform-origin:center}
.sheen{animation:sheen 6s ease-in-out infinite}
.nudge{animation:nudge 1.8s ease-in-out infinite;transform-box:fill-box}
.nudgeup{animation:nudgeup 1.8s ease-in-out infinite;transform-box:fill-box}
.far{animation:far 12s linear infinite}.near{animation:near .5s linear infinite}
.eq{animation:eq 1.3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.bit{animation:bit 2.4s linear infinite}
@keyframes far{to{transform:translateX(-104px)}}@keyframes near{to{transform:translateX(-24px)}}
@keyframes eq{0%,100%{transform:none}50%{transform:scaleY(.35)}}
@keyframes bit{0%{opacity:0;transform:none}15%{opacity:1}100%{opacity:0;transform:translateY(-34px)}}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes slide{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.3)}70%{opacity:1;transform:scale(1.18)}100%{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleY(0)}to{transform:none}}
@keyframes growx{from{transform:scaleX(0)}to{transform:none}}
@keyframes tilein{0%{opacity:0;transform:translateY(80px) scale(.65) rotate(-8deg)}55%{opacity:1;transform:translateY(-9px) scale(1.04) rotate(1.8deg)}78%{transform:translateY(3px) scale(.985) rotate(-.6deg)}100%{opacity:1;transform:none}}
@keyframes live{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes ring{0%{opacity:.55;transform:scale(.35)}70%,100%{opacity:0;transform:scale(2.3)}}
@keyframes sheen{0%{transform:translateX(-140px) skewX(-20deg)}28%,100%{transform:translateX(420px) skewX(-20deg)}}
@keyframes nudge{0%,100%{transform:none}50%{transform:translateX(3px)}}
@keyframes nudgeup{0%,100%{transform:none}50%{transform:translate(2px,-2px)}}
.still{display:none}
@media (prefers-reduced-motion:reduce){.a,.live,.ring,.sheen,.nudge,.nudgeup,.far,.near,.eq,.bit{animation:none!important}.smil{display:none}.still{display:inline}}
</style><g class="a tilein" style="animation-delay:2.350s"><defs><clipPath id="clip1"><rect x="4.7" y="0.0" width="284.0" height="208.0" rx="12" fill="#000"/></clipPath></defs><rect x="4.7" y="0.0" width="284.0" height="208.0" rx="12" fill="#FFD93D"/><g clip-path="url(#clip1)"><rect x="4.666666666666686" y="-20" width="46" height="248" fill="#fff" opacity=".28" transform="translate(-300 0)" class="sheen" style="animation-delay:4.650s"/></g><text x="24.7" y="34.0" font-family="mm" font-size="10" fill="#16162E" letter-spacing="1.3">PROJETOS</text><circle cx="261.6666666666667" cy="30" r="9" fill="none" stroke="#16162E" stroke-width="1.2" opacity="0" class="ring" style="animation-delay:3.950s"/><g class="nudge" style="animation-delay:3.550s"><text x="266.7" y="34.0" font-family="mm" font-size="13" fill="#16162E" text-anchor="end">→</text></g><g class="smil"><text x="44.2" y="104.0" font-family="si" font-size="40" fill="#16162E" text-anchor="end" opacity="0">2<set attributeName="opacity" to="1" begin="2.850s"/><set attributeName="opacity" to="0" begin="3.200s"/></text><text x="44.2" y="104.0" font-family="si" font-size="40" fill="#16162E" text-anchor="end" opacity="0">4<set attributeName="opacity" to="1" begin="3.200s"/></text></g><g class="still"><text x="44.2" y="104.0" font-family="si" font-size="40" fill="#16162E" text-anchor="end">4</text></g><text x="54.2" y="104.0" font-family="si" font-size="40" fill="#16162E">projetos</text><text x="24.7" y="136.0" font-family="sm" font-size="12" fill="#16162E" fill-opacity=".82">Dados, redes, Linux e automação em Python</text><text x="24.7" y="153.0" font-family="sm" font-size="12" fill="#16162E" fill-opacity=".82">— cada um documentado com relatório e</text><text x="24.7" y="170.0" font-family="sm" font-size="12" fill="#16162E" fill-opacity=".82">evidências.</text></g></svg>